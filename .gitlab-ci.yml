stages:
  - build
  - deploy

variables:
  NODE_VERSION: "18"

build:
  stage: build
  image: node:${NODE_VERSION}
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  only:
    - main
    - master

deploy:
  stage: deploy
  image: node:${NODE_VERSION}
  dependencies:
    - build
  before_script:
    - npm install -g @azure/static-web-apps-cli
  script:
    - swa deploy ./dist --deployment-token "$AZURE_STATIC_WEB_APPS_DEPLOYMENT_TOKEN"
  only:
    - main
    - master
  environment:
    name: production

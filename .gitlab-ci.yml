stages:
  - build
  - deploy

build:frontend:
  image: node:18
  stage: build
  script:
    - npm install
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  only:
    - main
    - master

deploy:frontend:
  image: mcr.microsoft.com/azure-cli:latest
  stage: deploy
  dependencies:
    - build:frontend
  script:
    - apk add --no-cache bash
    - |
      # Deploy to Azure Web App
      az login --service-principal -u $AZURE_CLIENT_ID -p $AZURE_CLIENT_SECRET --tenant $AZURE_TENANT_ID
      
      az staticwebapp update \
        --name fronteynfrontend \
        --resource-group Fonteyn \
        --source "$(pwd)/dist"
      
      echo "Frontend deployed successfully to Azure Static Web Apps"
  only:
    - main
    - master
  environment:
    name: production
    url: https://fronteynfrontend.delightfulsea-663eb54f.spaincentral.azurecontainerapps.io

stages:
  - build
  - deploy

# Frontend build and Docker image creation
build:frontend:
  image: docker:latest
  stage: build
  services:
    - docker:dind
  variables:
    DOCKER_IMAGE: $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA
    DOCKER_IMAGE_LATEST: $CI_REGISTRY_IMAGE/frontend:latest
  before_script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - docker build -t $DOCKER_IMAGE -t $DOCKER_IMAGE_LATEST .
    - docker push $DOCKER_IMAGE
    - docker push $DOCKER_IMAGE_LATEST
  only:
    - main
    - master

# Frontend deployment to Azure Web App
deploy:frontend:
  image: mcr.microsoft.com/azure-cli:latest
  stage: deploy
  script:
    - apk add --no-cache curl jq bash
    - |
      # Get container registry credentials
      USERNAME=$(echo $CI_REGISTRY_USER)
      PASSWORD=$(echo $CI_REGISTRY_PASSWORD)
      IMAGE_URL="$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"
      
      # Deploy to Azure Web App
      az login --service-principal -u $AZURE_CLIENT_ID -p $AZURE_CLIENT_SECRET --tenant $AZURE_TENANT_ID
      
      az containerapp update \
        --name fronteynfrontend \
        --resource-group Fonteyn \
        --image $IMAGE_URL \
        --registry-server $CI_REGISTRY \
        --registry-username $CI_REGISTRY_USER \
        --registry-password $CI_REGISTRY_PASSWORD
      
      echo "Frontend deployed successfully to Azure Container Apps"
  only:
    - main
    - master
  environment:
    name: production
    url: https://fronteynfrontend.delightfulsea-663eb54f.spaincentral.azurecontainerapps.io
    - master

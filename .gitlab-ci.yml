stages:
  - build
  - deploy

build:frontend:
  image: node:18
  stage: build
  script:
    - npm install
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  only:
    - main
    - master

deploy:frontend:
  image: node:18
  stage: deploy
  dependencies:
    - build:frontend
  script:
    - npm install -g @azure/static-web-apps-cli
    - |
      swa deploy \
        ./dist \
        --deployment-token "$AZURE_STATIC_WEB_APPS_DEPLOYMENT_TOKEN"
      
      echo "Frontend deployed successfully to Azure Static Web Apps"
  only:
    - main
    - master
  environment:
    name: production
    url: https://wonderful-mushroom-0ea303e03.3.azurestaticapps.net
